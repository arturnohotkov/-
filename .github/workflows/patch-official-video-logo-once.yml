name: Точна заміна значка у відео без зміни озвучення
on:
  push:
    branches: [main]
    paths:
      - tools/replace-video-logo-only.py
permissions:
  contents: write
concurrency:
  group: integrity-site-publication
  cancel-in-progress: false
jobs:
  logo:
    if: "${{ github.event.head_commit.message == 'Run official V logo-only video patch' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Підготувати інструменти для точного логотипу
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --quiet 'Pillow>=11,<13' 'CairoSVG>=2.7,<3'
      - name: Зчитати вже опубліковане відео і незмінні українські субтитри
        run: |
          set -euo pipefail
          mkdir -p rendered-logo-patch
          git fetch origin gh-pages
          git show origin/gh-pages:vorobtsi-intro.mp4 > rendered-logo-patch/before.mp4
          git show origin/gh-pages:vorobtsi-intro.uk.vtt > rendered-logo-patch/before.uk.vtt
          test -s rendered-logo-patch/before.mp4
          test -s rendered-logo-patch/before.uk.vtt
      - name: Замінити лише значок на V із mark.svg без зміни аудіо
        run: python tools/replace-video-logo-only.py
      - name: Перевірити відео та тотожність звукової доріжки
        run: |
          set -euo pipefail
          test -s rendered-logo-patch/vorobtsi-intro.mp4
          test -s rendered-logo-patch/vorobtsi-intro-poster.jpg
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 rendered-logo-patch/vorobtsi-intro.mp4 | grep -q aac
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 rendered-logo-patch/vorobtsi-intro.mp4 | grep -q h264
      - name: Опублікувати тільки відео й оновлений постер на цій же адресі
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add -B gh-pages "$RUNNER_TEMP/gh-logo" origin/gh-pages
          cp rendered-logo-patch/vorobtsi-intro.mp4 "$RUNNER_TEMP/gh-logo/vorobtsi-intro.mp4"
          cp rendered-logo-patch/vorobtsi-intro-poster.jpg "$RUNNER_TEMP/gh-logo/vorobtsi-intro-poster.jpg"
          git -C "$RUNNER_TEMP/gh-logo" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/gh-logo" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$RUNNER_TEMP/gh-logo" add -f vorobtsi-intro.mp4 vorobtsi-intro-poster.jpg
          git -C "$RUNNER_TEMP/gh-logo" diff --cached --quiet && exit 1
          git -C "$RUNNER_TEMP/gh-logo" commit -m "Replace Cyrillic emblem with official Latin V without changing voice"
          git -C "$RUNNER_TEMP/gh-logo" push origin HEAD:gh-pages
