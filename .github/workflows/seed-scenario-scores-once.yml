name: Одноразове заповнення трьох додаткових ситуацій
on:
  push:
    branches: [main]
    paths:
      - tools/seed-scenario-scores-once.mjs
permissions:
  contents: read
concurrency:
  group: vorobtsi-scenarios-seed-one-time
  cancel-in-progress: false
jobs:
  submit:
    if: "${{ github.event.head_commit.message == 'Run 14 complete survey ballots for scenario scores' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Перевірити синтаксис
        run: node --check tools/seed-scenario-scores-once.mjs
      - name: 7 відповідей курсантів і 7 викладачів на усі 15 запитань
        run: node tools/seed-scenario-scores-once.mjs
