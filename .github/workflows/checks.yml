name: Перевірка прототипу
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check public/vector.js
      - run: node --check public/live.js
      - run: node --check public/manager.mjs
      - run: node --check core/live.mjs
      - run: node --test checks/*.test.mjs
      - name: Перевірити сумісність спільного API
        run: |
          node --input-type=module -e 'try {const r=await fetch("https://vektor-integrity-lab.clayblade5.chatgpt.site/api/v1/live-info",{signal:AbortSignal.timeout(9000)}); const data=await r.json(); console.log("Remote API status:",r.status,"manualMeasures:",Boolean(data.manualMeasures)); if(!data.manualMeasures)console.log("::warning::The hosted shared API does not yet support unrestricted management actions.") } catch(e){console.log("::warning::Remote shared API could not be verified:",e.message)}'

