name: Перевірка прототипу
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check public/vector.js
      - run: node --check public/live.js
      - run: node --check public/manager.mjs
      - run: node --check core/live.mjs
      - run: node --test checks/*.test.mjs
