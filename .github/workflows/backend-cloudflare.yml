name: Розгортання спільного API (Cloudflare)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Перевірити API та збереження
        run: node --test checks/*.test.mjs
      - name: Перевірити обов'язкові секрети Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          VECTOR_MANAGER_HASH: ${{ secrets.VECTOR_MANAGER_HASH }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Потрібен CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Потрібен CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          printf '%s' "$CLOUDFLARE_D1_DATABASE_ID" | grep -Eq '^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$' || { echo "::error::Потрібен CLOUDFLARE_D1_DATABASE_ID з Cloudflare D1"; exit 1; }
          printf '%s' "$VECTOR_MANAGER_HASH" | grep -Eq '^[a-fA-F0-9]{64}$' || { echo "::error::Потрібен SHA-256 ключа керівника у VECTOR_MANAGER_HASH"; exit 1; }
      - name: Прив'язати підготовлену базу D1 до Worker
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import {readFileSync,writeFileSync} from 'node:fs';
          const file='wrangler.jsonc';
          const config=JSON.parse(readFileSync(file,'utf8'));
          config.d1_databases[0].database_id=process.env.CLOUDFLARE_D1_DATABASE_ID;
          writeFileSync(file,JSON.stringify(config,null,2));
          console.log('Підготовлено прив’язку D1 (ідентифікатор не виводиться).');
          EOF
      - name: Створити таблиці без видалення наявних даних
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply DB --remote
      - name: Розгорнути API з цього самого репозиторію
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Додати приватний ключ для входу керівника
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VECTOR_MANAGER_HASH: ${{ secrets.VECTOR_MANAGER_HASH }}
        shell: bash
        run: printf '%s' "$VECTOR_MANAGER_HASH" | npx --yes wrangler@4 secret put VECTOR_MANAGER_HASH
