name: Розгортання спільного API (Cloudflare)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Перевірити API та збереження
        run: node --test checks/*.test.mjs
      - name: Перевірити налаштування безпеки
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VECTOR_MANAGER_HASH: ${{ secrets.VECTOR_MANAGER_HASH }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Немає CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Немає CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          printf '%s' "$VECTOR_MANAGER_HASH" | grep -Eq '^[a-fA-F0-9]{64}$' || { echo "::error::Задайте SHA-256 чинного ключа керівника у секреті VECTOR_MANAGER_HASH"; exit 1; }
      - name: Створити або перевірити прив'язку D1 під час розгортання
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Застосувати схему D1 без видалення наявних таблиць
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply DB --remote
      - name: Оновити секрет керівника без публікації в коді
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VECTOR_MANAGER_HASH: ${{ secrets.VECTOR_MANAGER_HASH }}
        shell: bash
        run: printf '%s' "$VECTOR_MANAGER_HASH" | npx --yes wrangler@4 secret put VECTOR_MANAGER_HASH
